---
# Mantis (dual UR5) VR teleop config — left arm.
#
# Runs BOTH inside the docker container and on the host: urdf/srdf below are
# RELATIVE to this config file's directory (the shared dir is /home/ros/share in
# the container and ~/rabota/docker_shared on the host), and the URDF references
# meshes via package:// (resolved through AMENT_PREFIX_PATH: /opt/ros + mantis_ws
# in the container; ~/rabota/mantis_host_deps/fakeprefix on the host).
#
# In-container start (robot/sim stack in another terminal):
#   source /opt/ros/jazzy/setup.bash && source /home/ros/share/mantis_ws/install/setup.bash
#   python3 /home/ros/share/teleop_mantis.py
# vive_pub always runs ON THE HOST (SteamVR): ~/rabota/docker_shared/run_vive_pub.sh
#
# Regenerate the URDF after robot-configuration changes (host):
#   source ~/rabota/SO-100-HTC-vive-teleop/.pixi/envs/default/setup.bash   # (colcon install/setup.bash сломан после переезда)
#   export AMENT_PREFIX_PATH=~/rabota/mantis_host_deps/fakeprefix:$AMENT_PREFIX_PATH
#   # fakeprefix: wsg_50_simulation и prl_ur5_description — СИМЛИНКИ на src (2026-07-16), правки xacro подхватываются сами
#   python -c "import xml.parsers.expat, xacro; open('/tmp/m.urdf','w').write(xacro.process_file('/home/zxckiryuha/rabota/docker_shared/mantis_ws/src/prl_ur5_ros2/prl_ur5_description/urdf/mantis.urdf.xacro', mappings={'gz_sim':'true'}).toprettyxml(indent='  '))"
#   sed -e "s|file:///home/zxckiryuha/rabota/mantis_host_deps/fakeprefix/share/ur_description|package://ur_description|g" -e "s|file:///home/zxckiryuha/rabota/mantis_host_deps/fakeprefix/share/prl_ur5_description|package://prl_ur5_description|g" /tmp/m.urdf > /home/zxckiryuha/rabota/docker_shared/mantis_ws/mantis.urdf
#
# NOTE: barrier keys (collision_barrier, d_min, ...) live under ik:, NOT teleop:
# — values left under teleop: are ignored (a warning is printed at start).
urdf: mantis_ws/mantis.urdf
srdf: mantis_ws/src/prl_ur5_ros2/prl_ur5_moveit/config/mantis.srdf
ee_frame: left_tool0
shoulder_joint: left_shoulder_lift_joint
arm: [left_shoulder_pan_joint, left_shoulder_lift_joint, left_elbow_joint,
      left_wrist_1_joint, left_wrist_2_joint, left_wrist_3_joint]
# forward_position_controller drives BOTH arms; joints we don't teleoperate are
# filled from their measured positions on every publish.
arm_cmd_joints: [left_shoulder_pan_joint, left_shoulder_lift_joint, left_elbow_joint,
                 left_wrist_1_joint, left_wrist_2_joint, left_wrist_3_joint,
                 right_shoulder_pan_joint, right_shoulder_lift_joint, right_elbow_joint,
                 right_wrist_1_joint, right_wrist_2_joint, right_wrist_3_joint]
# Parked pose of everything NOT in `arm` (right arm), rad. At startup the bridge
# compares this with the MEASURED /joint_states and automatically rebuilds the
# collision model at the real parked pose if any joint differs by >0.1 rad, so
# left-vs-right avoidance always matches reality. Values here are only the
# fallback for joints that never appear in /joint_states.
locked_q: {}
rate: 100.0

ik:
  position_cost: 1.0
  orientation_cost: 0.9       # 6-DOF arm: orientation fully controllable; position still dominates
                              # NOTE 2026-07-15: a vector [0.6,0.6,0.15] (lazy tool-axis roll) was tried
                              # and REVERTED: tool down -> hand yaw IS tool roll; tracking felt broken.
  lm_damping: 0.01            # Levenberg-Marquardt damping: tames velocities near singularities
  task_gain: 0.9              # per-tick error gain; higher = less tracking lag (keep <= 1.0)
  posture_cost: 0.02          # regularizes elbow configuration / null space
  vel_scale: 0.1
  collision_margin: 0.01
  # Collision handling: gap >= d_min enforced as a hard QP inequality -> the arm
  # dodges (itself, the other arm, table, walls, camera fixtures) instead of freezing.
  collision_barrier: true
  d_min: 0.015                # m, hard minimum link-pair gap (keep > collision_margin)
  d_min_self: 0.006           # m, floor for arm SELF pairs. forearm<->wrist_2 hull gap has a ~15mm
                              # plateau over almost the whole wrist range: with d_min=15mm that pair
                              # was pinned on the floor 70-90% of the time (diag 2026-07-10) — stealing
                              # wrist DOF (bad orientation tracking, reconfigurations) and chattering.
                              # The real fold collision still gets blocked at 6mm of HULL gap.
  d_influence: 0.04           # m, "near collision" indicator threshold above the pair's floor (logs)
  barrier_gain: 15.0          # was 100.0: gain*dt=1.0 at 100 Hz = discrete CBF with zero stability
                              # margin -> 50 Hz bang-bang on any active constraint (the violent shaking
                              # in the 2026-07-10 bag, markers M1/M2). Keep gain*dt <= ~0.2.
  barrier_safe_gain: 0.0      # keep 0: pink's safe-displacement pull acts everywhere and drags the arm
  self_collision_min_hops: 2  # drop arm-arm pairs closer than this in the kinematic tree
  n_collision_pairs: 32       # barrier handles the 32 closest pairs (0 = all); python jacobian is linear in this
  prune_samples: 20000        # reachability prune sampling (0 = disable)
  prune_margin: 0.05          # m, drop arm-vs-static pairs never closer than this
  drop_dist_thresh: 0.03      # m, drop non-env static pairs already nearer than this at reference pose
  env_keywords: [table, wall, floor, ground, camera]   # never drop pairs with these (by name)

teleop:
  scale: 1                # controller-to-robot position scale (your working value)
  az_gain: 1.0                # azimuth gain around the shoulder (your working value)
  reach_lo_frac: 0.05         # near-max shell: the barrier protects the near-base region
  reach_hi_frac: 0.99
  axis_sign: [-1.0, -1.0, 1.0]  # your working mapping
  axis_map: [2, 0, 1]           # your working mapping
  ori_sign: [-1.0, -1.0, 1.0]     # your working mapping
  yaw_fallback_deg: 15.0      # nose within this angle of vertical at engage -> heading from the controller TOP axis
  # --- latency / smoothing ---
  filter_min_cutoff: 0.4      # one-euro: jitter smoothing at rest (Hz); was 1.5 — lowered vs hand-tremor buzz on the real arm
  filter_beta: 5.0            # one-euro: cutoff growth with speed, Hz per m/s; was 15.0 — noise spikes were blowing the cutoff open
  max_target_speed: 1.0       # m/s cap on target motion (scale 1.2 needs headroom)
  max_lead: 0.08              # m, max target distance ahead of the (commanded) EE
  max_ang_speed: 4.0          # rad/s slew of desired orientation
  max_ang_lead: 0.5           # rad, max desired-vs-actual EE orientation lead
  ori_alpha: 0.15             # orientation smoothing (1.0 = off); was 0.8 = ~10ms time constant at 100Hz, i.e. no smoothing — raw Vive orientation jitter buzzed the wrists
  max_joint_lead: 0.15        # rad, max |cmd - measured| per joint (anti-runaway; also the max snap after an external block/pause)
  # --- robustness ---
  pose_timeout: 0.2           # s, /vive/pose considered stale -> freeze + re-anchor on recovery
  joint_timeout: 0.3          # s, joint_states considered stale -> hold IK + resync on recovery
  buttons_timeout: 0.5        # s, /vive/buttons considered stale -> gripper latches last state
  pad_debounce: 0.25          # s, min time between trackpad engage/freeze toggles
  disengage_blend_ticks: 5    # ticks to blend the command after a freeze (no step)
  vr_rate: 250.0              # Hz, target-shaping tick
  # --- output command shaping (teleop-side smoothness; robot config untouched) ---
  # A dedicated thread republishes the IK result at out_rate with velocity+accel
  # limits: kills the 100 Hz staircase / 125 Hz (CB3) beat and attenuates any
  # residual tick-level IK oscillation. OUTSTREAM log line = actual stream timing.
  out_rate: 250.0             # Hz robot-facing stream (0 = old direct 100 Hz publish)
  out_vel: 1.5                # rad/s per-joint cap of the shaped stream (safety net, above IK's own limit)
  out_accel: 10.0             # rad/s^2 per-joint cap — the smoothness knob (lower = smoother, more lag)
  out_kp: 20.0                # 1/s tracking stiffness (~1/out_kp s of extra lag at speed)

gripper:
  # Left arm carries the Weiss WSG50 (standard_setup.yaml: gripper "weiss-wsg50",
  # gripper_controller "weiss-gripper", enabled 2026-07-15). If the action server
  # is missing at runtime, the trigger logs "gripper action server not ready".
  # WSG50: position = opening WIDTH in meters (0.0 = closed, 0.11 = fully open) —
  # polarity is INVERTED vs the OnRobot RG2 values (0.0 open / 1.1 closed, rad).
  grip_open: 0.11
  grip_close: 0.0
  trig_hold: 0.15
  effort: 5.0                 # -> grasping force hint [N] (wsg50_setup.yaml default is 10)
  action: /left_gripper_controller/gripper_cmd

topics:
  arm_cmd: /forward_position_controller/commands
  joint_states: /joint_states
  vive_pose: /vive/pose
  vive_buttons: /vive/buttons

rlimits: {}
